<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Закрыто на переработку</title>
    <style>
        /* Сброс отступов и настройка фона */
        body {
            margin: 0;
            padding: 0;
            background-color: #1a1a1a; /* Темно-серый фон */
            color: #ffffff; /* Белый цвет текста по умолчанию */
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            
            /* Флексбокс для центрирования по вертикали и горизонтали */
            display: flex;
            flex-direction: column;
            justify-content: center;
            align-items: center;
            height: 100vh; /* Высота на весь экран */
            text-align: center;
            overflow: hidden;
        }

        /* Огромная надпись */
        h1 {
            font-size: 7vw; /* Размер шрифта подстраивается под ширину экрана */
            font-weight: 900;
            color: #ffcc00; /* Желтый предупреждающий цвет */
            text-transform: uppercase;
            margin: 0 0 30px 0;
            line-height: 1.1;
            text-shadow: 4px 4px 10px rgba(0, 0, 0, 0.7); /* Тень для объема */
            padding: 0 20px;
        }

        /* Текст снизу */
        p {
            font-size: 2vw; /* Меньший размер, но все еще читабельный */
            font-weight: 400;
            color: #e0e0e0;
            margin: 0;
            padding: 0 20px;
            max-width: 80%;
            line-height: 1.5;
        }

        /* Адаптивность для мобильных устройств */
        @media (max-width: 768px) {
            h1 {
                font-size: 12vw;
            }
            p {
                font-size: 5vw;
            }
        }
    </style>
</head>
<body>

    <h1>Закрыто на<br>переработку</h1>
    <p>Вы можете до сих пор пользоваться разделами<br><strong>Caesar, cb, eng, music, old, rat</strong></p>

</body>
</html>
